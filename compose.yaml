services:
  database:
    image: docker.io/library/mariadb:12

    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: unibite
      MARIADB_USER: nodejs
      MARIADB_PASSWORD: nodejs

    ports:
      - "3306:3306"

    volumes:
      - ./data/mariadb:/var/lib/mysql

  api:
    image: docker.io/library/node:26-alpine
    working_dir: /app

    volumes:
      - ./api:/app
      - /app/node_modules

    command: sh -c "npm install && npm start"

    ports:
      - "3000:3000"

    environment:
      CHOKIDAR_USEPOLLING: "true"

  web:
    image: docker.io/library/nginx:alpine

    volumes:
      - ./web:/usr/share/nginx/html:ro

    ports:
      - "8080:80"
